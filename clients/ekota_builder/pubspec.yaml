name: ekota_builder
description: Ekota Builder — Producer-facing Flutter app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # networking & storage
  http: ^1.2.0
  # state management
  provider: ^6.1.2

  # media
  image_picker: ^1.1.2
  video_player: ^2.9.1
  chewie: ^1.8.5
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0

  # utilities
  intl: ^0.19.0
  timeago: ^3.7.0
  uuid: ^4.5.1
  shared_preferences: ^2.5.5

flutter:
  uses-material-design: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
