name: ekota_syndicate
description: A minimal Flutter app for Ekota Syndicate
publish_to: 'none'
version: 0.0.1
environment:
  sdk: ">=2.18.0 <4.0.0"

flutter:
  uses-material-design: true
  assets:
    - .env

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.0
  socket_io_client: ^3.0.2
  intl: ^0.19.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
